<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搬瓦工 VPS 流量与代理安全异常检测面板</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.3);
            
            --warning: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.5;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .actions-bar {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .refresh-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 var(--primary-glow);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 var(--primary-glow);
            filter: brightness(1.1);
        }

        .refresh-btn i.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .card h2 i {
            color: var(--cyan);
        }

        .col-4 { grid-column: span 4; }
        .col-8 { grid-column: span 8; }
        .col-6 { grid-column: span 6; }
        .col-12 { grid-column: span 12; }

        @media (max-width: 1024px) {
            .col-4, .col-8, .col-6, .col-12 { grid-column: span 12; }
            header { flex-direction: column; gap: 16px; text-align: center; }
            .header-title h1 { justify-content: center; }
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-row:last-child {
            border: none;
            padding: 0;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            font-family: 'Outfit', monospace;
        }

        .progress-box {
            margin-top: 24px;
        }

        .progress-fill-wrap {
            height: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--cyan) 100%);
            border-radius: 8px;
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .charts-container { grid-template-columns: 1fr; }
        }

        .chart-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            min-height: 280px;
        }

        .top-switch-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .top-tab {
            flex: 1;
            padding: 6px 12px;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .top-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
        }

        .top-domains-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .top-domain-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .top-domain-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .top-domain-name {
            font-family: monospace;
            color: #a5b4fc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 68%;
        }

        .top-domain-count {
            color: var(--warning);
            font-weight: bold;
        }

        .top-domain-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
        }

        .top-domain-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--warning) 0%, var(--danger) 100%);
            border-radius: 3px;
            width: 0%;
            transition: width 0.8s ease;
        }

        .top-domain-bar-fill.blue-bar {
            background: linear-gradient(90deg, var(--cyan) 0%, var(--primary) 100%);
        }

        .log-table-container {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.01);
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        .log-table th {
            background: rgba(255, 255, 255, 0.03);
            padding: 14px 16px;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'Inter', sans-serif;
        }

        .log-table tr:last-child td {
            border: none;
        }

        .log-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .empty-logs {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-logs i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--success);
            opacity: 0.8;
        }

        #bwg-servers-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .server-sub-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .server-sub-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header>
            <div class="header-title">
                <h1><i class="fas fa-chart-network"></i> BWH Traffic Monitor & Safety</h1>
                <p>实时 VPS 流量统计与代理安全异常检测面板</p>
            </div>
            <div class="actions-bar">
                <span class="status-dot"></span>
                <span id="api-status">系统连接正常</span>
                <button class="refresh-btn" id="refresh-btn">
                    <i class="fas fa-sync-alt"></i> 刷新数据
                </button>
            </div>
        </header>

        <!-- 搬瓦工 VPS 服务器大盘 -->
        <div class="grid-layout">
            <div class="card col-12">
                <h2><i class="fas fa-server" style="color: var(--cyan);"></i> 搬瓦工 VPS 服务器大盘</h2>
                <div id="bwg-servers-container">
                    <div style="text-align: center; padding: 40px 0; color: var(--text-secondary);">
                        <i class="fas fa-spinner spinning"></i> 正在加载服务器状态...
                    </div>
                </div>
            </div>
        </div>

        <!-- 历史流量趋势分析 -->
        <div class="grid-layout">
            <div class="card col-12">
                <h2><i class="fas fa-chart-line"></i> 历史流量趋势分析</h2>
                <div class="charts-container">
                    <div class="chart-wrapper">
                        <canvas id="dailyChart"></canvas>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 局域网各终端电脑使用状况监控 与 误走代理域名分析 Top 10 -->
        <div class="grid-layout">
            <!-- 终端流量监控 (col-8) -->
            <div class="card col-8">
                <h2><i class="fas fa-desktop" style="color: var(--cyan);"></i> 局域网各终端电脑使用状况监控</h2>
                <div class="log-table-container">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>设备名称</th>
                                <th>在线状态</th>
                                <th>当前出站节点 IP</th>
                                <th>累计已用下载</th>
                                <th>累计已用上传</th>
                                <th>累计消耗总量</th>
                            </tr>
                        </thead>
                        <tbody id="devices-traffic-body">
                            <tr>
                                <td colspan="6" class="empty-logs" style="padding: 40px 0;">
                                    <i class="fas fa-spinner spinning"></i><br>正在加载终端监控数据...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Top 10 排行 (col-4) -->
            <div class="card col-4">
                <h2><i class="fas fa-list-ol" style="color: var(--warning);"></i> 误走代理域名分析 Top 10</h2>
                <!-- Tabs -->
                <div class="top-switch-tabs">
                    <button class="top-tab active" id="tab-count">请求次数排行</button>
                    <button class="top-tab" id="tab-traffic">流量排行</button>
                </div>
                <div class="top-domains-list" id="top-domains-list">
                    <div class="empty-logs" style="padding: 20px 0;">
                        <i class="fas fa-spinner spinning" style="font-size: 1.25rem;"></i><br>加载中...
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时异常流量明细 -->
        <div class="grid-layout">
            <div class="card col-12">
                <h2><i class="fas fa-shield-exclamation" style="color: var(--warning);"></i> 疑似异常直连流量明细 (最新20条)</h2>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 24px;">
                    误经代理转发的最新连接列表(时间、目标、策略)
                </p>
                <div class="log-table-container">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>时间 (美东)</th>
                                <th>客户端源 IP</th>
                                <th>动作</th>
                                <th>目标</th>
                                <th>策略</th>
                            </tr>
                        </thead>
                        <tbody id="log-body">
                            <tr>
                                <td colspan="5" class="empty-logs">
                                    <i class="fas fa-spinner spinning"></i><br>正在加载异常明细...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const elements = {
            apiStatus: document.getElementById('api-status'),
            refreshBtn: document.getElementById('refresh-btn'),
            logBody: document.getElementById('log-body'),
            topDomainsList: document.getElementById('top-domains-list'),
            tabCount: document.getElementById('tab-count'),
            tabTraffic: document.getElementById('tab-traffic'),
            bwgServersContainer: document.getElementById('bwg-servers-container'),
            devicesTrafficBody: document.getElementById('devices-traffic-body')
        };

        let dailyChartInstance = null;
        let weeklyChartInstance = null;
        let cacheAbnormalData = null;
        let currentTab = 'count'; // 'count' 或 'traffic'

        function bytesToGB(bytes) {
            return (bytes / 1073741824).toFixed(2);
        }

        // 格式化字节单位
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function timestampToDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function calculateCountdown(timestamp) {
            const now = new Date();
            const resetDate = new Date(timestamp * 1000);
            const diff = resetDate - now;
            
            if (diff <= 0) return "已重置";
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            return `${days}天 ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 智能单位转换 Chart.js 图表渲染
        function renderCharts(data) {
            if (dailyChartInstance) dailyChartInstance.destroy();
            if (weeklyChartInstance) weeklyChartInstance.destroy();

            const maxDaily = Math.max(...data.daily_values, 0);
            const useGBForDaily = maxDaily >= 1024;
            const dailyUnit = useGBForDaily ? 'GB' : 'MB';
            const dailyData = useGBForDaily ? data.daily_values.map(v => (v / 1024).toFixed(2)) : data.daily_values;

            const maxWeekly = Math.max(...data.weekly_values, 0);
            const useGBForWeekly = maxWeekly >= 1024;
            const weeklyUnit = useGBForWeekly ? 'GB' : 'MB';
            const weeklyData = useGBForWeekly ? data.weekly_values.map(v => (v / 1024).toFixed(2)) : data.weekly_values;

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#9ca3af', font: { family: 'Inter' } }
                    },
                    y: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#9ca3af', font: { family: 'Inter' } }
                    }
                }
            };

            const ctxDaily = document.getElementById('dailyChart').getContext('2d');
            dailyChartInstance = new Chart(ctxDaily, {
                type: 'line',
                data: {
                    labels: data.daily_labels,
                    datasets: [{
                        label: `日流量消耗 (${dailyUnit})`,
                        data: dailyData,
                        borderColor: '#06b6d4',
                        backgroundColor: 'rgba(6, 182, 212, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2,
                        pointBackgroundColor: '#06b6d4'
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: `最近 7 天每日流量趋势 (${dailyUnit})`, color: '#f3f4f6', font: { size: 13, weight: 'bold' } }
                    }
                }
            });

            const ctxWeekly = document.getElementById('weeklyChart').getContext('2d');
            weeklyChartInstance = new Chart(ctxWeekly, {
                type: 'bar',
                data: {
                    labels: data.weekly_labels,
                    datasets: [{
                        label: `周流量消耗 (${weeklyUnit})`,
                        data: weeklyData,
                        backgroundColor: 'rgba(99, 102, 241, 0.65)',
                        borderColor: '#6366f1',
                        borderWidth: 1.5,
                        borderRadius: 6
                    }]
                },
                options: {
                    ...commonOptions,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: `最近 4 周每周流量对比 (${weeklyUnit})`, color: '#f3f4f6', font: { size: 13, weight: 'bold' } }
                    }
                }
            });
        }

        // 渲染异常日志与排行榜
        function renderLogsAndTabs() {
            if (!cacheAbnormalData) return;

            const logs = cacheAbnormalData.records;
            const topDomains = cacheAbnormalData.top_domains;
            const domainTraffics = cacheAbnormalData.domain_traffics;

            if (currentTab === 'count') {
                if (!topDomains || topDomains.length === 0) {
                    elements.topDomainsList.innerHTML = `
                        <div class="empty-logs" style="padding: 20px 0;">
                            <i class="fas fa-check-circle" style="color: var(--success); font-size: 1.5rem;"></i><br>暂无频次排行记录
                        </div>
                    `;
                } else {
                    const maxCount = topDomains[0].count;
                    let html = '';
                    topDomains.forEach(item => {
                        const widthPercent = maxCount > 0 ? (item.count / maxCount * 100) : 0;
                        html += `
                            <div class="top-domain-item">
                                <div class="top-domain-meta">
                                    <span class="top-domain-name" title="${item.domain}">${item.domain}</span>
                                    <span class="top-domain-count">${item.count} 次</span>
                                </div>
                                <div class="top-domain-bar-bg">
                                    <div class="top-domain-bar-fill" style="width: ${widthPercent}%"></div>
                                </div>
                            </div>
                        `;
                    });
                    elements.topDomainsList.innerHTML = html;
                }
            } else if (currentTab === 'traffic') {
                if (!domainTraffics || domainTraffics.length === 0) {
                    elements.topDomainsList.innerHTML = `
                        <div class="empty-logs" style="padding: 20px 0;">
                            <i class="fas fa-info-circle" style="color: var(--text-secondary); font-size: 1.5rem;"></i><br>暂无流量排行数据<br><span style="font-size:0.75rem;">(VPS 统计服务需要累积数据)</span>
                        </div>
                    `;
                } else {
                    const maxBytes = domainTraffics[0].bytes;
                    let html = '';
                    domainTraffics.forEach(item => {
                        const widthPercent = maxBytes > 0 ? (item.bytes / maxBytes * 100) : 0;
                        const readableSize = formatBytes(item.bytes);
                        html += `
                            <div class="top-domain-item">
                                <div class="top-domain-meta">
                                    <span class="top-domain-name" title="${item.domain}">${item.domain}</span>
                                    <span class="top-domain-count" style="color: var(--cyan);">${readableSize}</span>
                                </div>
                                <div class="top-domain-bar-bg">
                                    <div class="top-domain-bar-fill blue-bar" style="width: ${widthPercent}%"></div>
                                </div>
                            </div>
                        `;
                    });
                    elements.topDomainsList.innerHTML = html;
                }
            }

            if (!logs || logs.length === 0) {
                elements.logBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-logs">
                            <i class="fas fa-shield-check"></i><br>暂无任何异常直连流量记录，您的代理分流一切正常！
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            logs.forEach(log => {
                const badgeClass = log.strategy === 'block' ? 'badge-danger' : (log.strategy === 'direct' ? 'badge-warning' : 'badge-success');
                const shortTime = log.time.length > 5 ? log.time.substring(5) : log.time;
                html += `
                    <tr>
                        <td style="color: var(--text-secondary); font-size: 0.82rem;">${shortTime}</td>
                        <td style="font-family: monospace; font-size: 0.85rem;">${log.source}</td>
                        <td>${log.action === 'accepted' ? '<span style="color: var(--success);">允许</span>' : '<span style="color: var(--danger);">拦截</span>'}</td>
                        <td style="font-weight: 500; font-family: monospace; color: #a5b4fc; word-break: break-all;">${log.target}</td>
                        <td><span class="badge ${badgeClass}">${log.strategy}</span></td>
                    </tr>
                `;
            });
            elements.logBody.innerHTML = html;
        }

        // 获取并渲染搬瓦工多服务器大盘及设备关联
        async function fetchPublicNodes() {
            try {
                const resp = await fetch('api/nodes');
                if (!resp.ok) throw new Error("获取服务器列表失败");
                const servers = await resp.json();
                
                if (servers.length === 0) {
                    elements.bwgServersContainer.innerHTML = `
                        <div style="text-align: center; padding: 40px 0; color: var(--text-secondary);">
                            <i class="fas fa-info-circle"></i> 暂无已配置的搬瓦工服务器
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                servers.forEach(srv => {
                    const usedGB = bytesToGB(srv.official_used);
                    const limitGB = bytesToGB(srv.official_limit);
                    const pct = srv.official_limit > 0 ? ((srv.official_used / srv.official_limit) * 100).toFixed(1) : 0;
                    const clientAcc = formatBytes(srv.client_accumulated);
                    
                    const resetTimeStr = srv.next_reset > 0 ? timestampToDate(srv.next_reset) : '未获取';
                    const countdownStr = srv.next_reset > 0 ? calculateCountdown(srv.next_reset) : '--';
                    
                    let devicesHtml = '';
                    if (srv.active_devices && srv.active_devices.length > 0) {
                        devicesHtml = srv.active_devices.map(d => `<span class="badge badge-success" style="margin-right:4px; margin-top:4px; font-size:0.75rem;">${d}</span>`).join('');
                    } else {
                        devicesHtml = '<span style="font-size:0.75rem; color:var(--text-secondary);">暂无活跃连入</span>';
                    }
                    
                    html += `
                        <div class="server-sub-card">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <strong style="color: var(--text-primary); font-size: 0.95rem;">${srv.name}</strong>
                                <span style="font-size: 0.75rem; color: var(--text-secondary); font-family: monospace;">${srv.ip}</span>
                            </div>
                            
                            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary);">
                                <span>已用: ${usedGB} GB / ${limitGB} GB</span>
                                <span>${pct}%</span>
                            </div>
                            
                            <div class="progress-fill-wrap" style="height: 6px; margin-top: 0;">
                                <div class="progress-fill" style="width: ${pct}%; height: 100%;"></div>
                            </div>
                            
                            <div style="font-size: 0.75rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">
                                <span>客户端累计: <strong style="color: var(--cyan);">${clientAcc}</strong></span>
                                <span>重置日期: <strong style="color: var(--text-primary);">${resetTimeStr}</strong></span>
                                <span>重置倒计时: <strong style="color: var(--warning);">${countdownStr}</strong></span>
                                <div style="display: flex; align-items: center; flex-wrap: wrap; margin-top: 2px;">
                                    <span style="margin-right: 4px;">当前在线设备:</span> ${devicesHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                elements.bwgServersContainer.innerHTML = html;
            } catch (err) {
                console.error("获取服务器大盘失败:", err);
            }
        }

        // 轮询获取所有电脑终端的流量
        async function fetchDevicesList() {
            try {
                const resp = await fetch('api/devices');
                if (!resp.ok) throw new Error("获取终端监控数据失败");
                const devices = await resp.json();
                
                if (devices.length === 0) {
                    elements.devicesTrafficBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="empty-logs" style="padding: 40px 0;">
                                <i class="fas fa-info-circle"></i><br>暂无已上报流量数据的终端设备
                            </td>
                        </tr>
                    `;
                    return;
                }
                
                let html = '';
                devices.forEach(dev => {
                    const statusDot = dev.online 
                        ? '<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:#10b981; margin-right:6px; box-shadow: 0 0 8px #10b981;"></span>' 
                        : '<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:#ef4444; margin-right:6px; box-shadow: 0 0 8px #ef4444;"></span>';
                    
                    const onlineText = dev.online ? '<span style="color:#10b981; font-weight:600;">在线</span>' : '<span style="color:#ef4444; font-weight:600;">离线</span>';
                    const dl = formatBytes(dev.total_download);
                    const ul = formatBytes(dev.total_upload);
                    const total = formatBytes(dev.total_download + dev.total_upload);
                    
                    html += `
                        <tr>
                            <td style="font-weight: 600; font-size: 0.95rem; color: #f3f4f6;">${dev.name}</td>
                            <td>
                                <div style="display: flex; align-items: center;">
                                    ${statusDot} ${onlineText}
                                </div>
                            </td>
                            <td style="font-weight: 500; color: #a5b4fc; font-family: monospace;">${dev.current_node || '直连或未知'}</td>
                            <td style="font-family: monospace; color: var(--text-secondary);">${dl}</td>
                            <td style="font-family: monospace; color: var(--text-secondary);">${ul}</td>
                            <td style="font-weight: 700; color: var(--cyan); font-family: monospace;">${total}</td>
                        </tr>
                    `;
                });
                elements.devicesTrafficBody.innerHTML = html;
            } catch (err) {
                console.error("获取设备列表发生异常:", err);
            }
        }

        // 全量数据刷新
        async function fetchAllData() {
            const refreshIcon = elements.refreshBtn.querySelector('i');
            refreshIcon.classList.add('spinning');
            elements.refreshBtn.disabled = true;
            elements.apiStatus.textContent = "正在同步数据...";

            try {
                // 1. 获取历史流量统计数据
                try {
                    const historyResp = await fetch('api/history');
                    if (historyResp.ok) {
                        const historyData = await historyResp.json();
                        renderCharts(historyData);
                    }
                } catch (err) {
                    console.error("同步历史趋势数据失败:", err);
                }

                // 2. 获取异常流量与域名流量
                try {
                    const logResp = await fetch('api/abnormal_traffic');
                    if (logResp.ok) {
                        cacheAbnormalData = await logResp.json();
                        renderLogsAndTabs();
                    }
                } catch (err) {
                    console.error("同步异常安全日志失败:", err);
                }

                // 3. 获取搬瓦工多服务器大盘
                await fetchPublicNodes();

                // 4. 获取局域网终端流量
                await fetchDevicesList();

                elements.apiStatus.textContent = "系统连接正常";
            } catch (error) {
                console.error("全局刷新遇到未知异常:", error);
                elements.apiStatus.textContent = "数据获取发生异常";
            } finally {
                refreshIcon.classList.remove('spinning');
                elements.refreshBtn.disabled = false;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            fetchAllData();
            elements.refreshBtn.addEventListener('click', fetchAllData);
            
            elements.tabCount.addEventListener('click', () => {
                elements.tabTraffic.classList.remove('active');
                elements.tabCount.classList.add('active');
                currentTab = 'count';
                renderLogsAndTabs();
            });
            
            elements.tabTraffic.addEventListener('click', () => {
                elements.tabCount.classList.remove('active');
                elements.tabTraffic.classList.add('active');
                currentTab = 'traffic';
                renderLogsAndTabs();
            });

            // 5 秒定时轮询终端和多服务器状态
            setInterval(fetchDevicesList, 5000);
            setInterval(fetchPublicNodes, 5000);

            // 每 15 分钟自动全局同步一次
            setInterval(fetchAllData, 15 * 60 * 1000);
        });
    </script>
</body>
</html>
